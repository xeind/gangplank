[package]
name = "gangplank-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shader effects inside GPUI layout: a fragment shader as an element, with time, pointer and resolution uniforms"

[dependencies]
gpui = { package = "gpui-ce", version = "0.3" }
log = "0.4"
naga = { version = "25", features = ["glsl-in", "wgsl-in", "msl-out"] }
regex = "1"

[dev-dependencies]
log = "0.4"
gpui = { package = "gpui-ce", version = "0.3", features = ["test-support"] }
image = "0.25"
gangplank = { path = "../gangplank" }
