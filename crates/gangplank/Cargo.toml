[package]
name = "gangplank"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hooks for GPUI: async state, debounce, persistence, shortcuts, and the other mechanics every app rewrites"

# The consumer's gpui must be the same crate instance as ours or Entity types
# will not match. Pick the source with a feature: `ce` (gpui-ce, default) or
# `zed` (the gpui crate Zed publishes).
[features]
default = ["ce"]
ce = ["dep:gpui"]
zed = ["dep:gpui_zed"]
# gpui-ce git HEAD after 2026-01 changed `Window::focus` to take a `cx`. Enable
# this with `zed` plus a `[patch.crates-io] gpui = { git = ..., rev = ... }`.
gpui-git = []

[dependencies]
gpui = { package = "gpui-ce", version = "0.3", optional = true }
gpui_zed = { package = "gpui", version = "0.2", optional = true }
dirs = "6"
serde = "1"
serde_json = "1"

[dev-dependencies]
# test-support gives a controllable clock, so timing is proved, not clicked.
gpui = { package = "gpui-ce", version = "0.3", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
